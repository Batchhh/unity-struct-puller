name: Sync Unity headers

on:
  # Scheduled sync paused — the current extractor copies raw Unity IL2CPP
  # source, but we actually want curated/reformatted struct headers. Re-enable
  # the cron once the extractor is pointed at the right source.
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Max versions to pull in one run"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: sync-unity-headers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Install legacy archive tools
        run: sudo apt-get update && sudo apt-get install -y cpio libarchive-tools

      - name: Build
        run: cargo build --release

      - name: Report missing versions
        run: ./target/release/unity-struct-puller missing | tee missing.txt | wc -l

      - name: Sync headers (commit per pull)
        env:
          LIMIT: ${{ github.event.inputs.limit || '3' }}
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          pulled=0
          failed=0
          while IFS= read -r v; do
            [ -z "$v" ] && continue
            if [ "$pulled" -ge "$LIMIT" ]; then
              echo "limit reached ($LIMIT)"
              break
            fi
            echo "::group::pull $v"
            if ./target/release/unity-struct-puller pull "$v"; then
              git add headers/
              if git diff --cached --quiet; then
                echo "no files added for $v (unexpected)"
              else
                git commit -m "ci: $v"
                # Retry push with rebase in case a parallel run just pushed.
                if ! git push; then
                  git pull --rebase --autostash || true
                  git push || echo "push failed for $v, continuing"
                fi
                pulled=$((pulled + 1))
              fi
            else
              echo "pull failed for $v, skipping"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < missing.txt

          echo "pulled=$pulled failed=$failed"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check
